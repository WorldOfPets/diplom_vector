<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f5f0">
    <title>Нет соединения — Вектор</title>
    <style>
        :root {
            color-scheme: light;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #f7f5f0;
            color: #101828;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100dvh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 15% 10%, rgba(45, 91, 255, 0.12), transparent 35%),
                radial-gradient(circle at 85% 80%, rgba(255, 107, 74, 0.10), transparent 35%),
                #f7f5f0;
        }

        main {
            width: min(100%, 440px);
            border: 1px solid #e6e1d7;
            border-radius: 32px;
            background: #fff;
            padding: 32px;
            box-shadow: 0 18px 45px -32px rgba(16, 24, 40, 0.35);
            text-align: center;
        }

        .mark {
            width: 56px;
            height: 56px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            border-radius: 18px;
            background: #101828;
            color: #fff;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -0.06em;
        }

        h1 { margin: 0; font-size: 26px; letter-spacing: -0.04em; }
        p { margin: 12px 0 0; color: #667085; line-height: 1.6; font-size: 14px; }

        button {
            margin-top: 22px;
            width: 100%;
            border: 0;
            border-radius: 999px;
            background: #2d5bff;
            color: #fff;
            padding: 13px 18px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
<main>
    <div class="mark">V</div>
    <h1>Нет соединения</h1>
    <p>Проверьте интернет и попробуйте снова. Уже сохранённые записи и прогресс останутся на месте.</p>
    <button type="button" onclick="location.reload()">Повторить</button>
</main>
</body>
</html>
